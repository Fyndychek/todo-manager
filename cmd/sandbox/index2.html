<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ NeiroSlop · Умный список</title>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0e14;
      color: #e4e9f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      max-width: 820px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span {
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      padding: 0.2rem 0.8rem;
      border-radius: 14px;
      color: #fff;
    }
    .stats-badge {
      background: #1e2430;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      gap: 1.2rem;
      border: 1px solid #2a3140;
    }
    .stats-badge span { font-weight: 600; color: #a78bfa; }

    /* ===== TOOLBAR (фильтр + сортировка) ===== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      background: #121820;
      padding: 0.7rem 1rem;
      border-radius: 20px;
      border: 1px solid #1e2430;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .toolbar-label {
      font-size: 0.8rem;
      color: #6b7a8f;
      margin-right: 0.2rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .filter-btn, .sort-btn, .order-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #8b9ab0;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-btn:hover, .sort-btn:hover, .order-btn:hover {
      background: #1e2430;
      color: #e4e9f2;
    }
    .filter-btn.active, .sort-btn.active, .order-btn.active {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }
    .sort-select {
      background: #1e2430;
      border: 1px solid #2a3140;
      color: #e4e9f2;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: #7c3aed; }

    /* ===== ADD FORM ===== */
    .add-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .add-form input {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      border: 2px solid #1e2430;
      background: #121820;
      color: #e4e9f2;
      font-size: 1rem;
      transition: border 0.2s;
    }
    .add-form input:focus {
      outline: none;
      border-color: #7c3aed;
    }
    .add-form input::placeholder { color: #5b657a; }
    .add-form button {
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .add-form button:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
    }
    .add-form button:active { transform: scale(0.97); }

    /* ===== TODO LIST ===== */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #121820;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      border: 1px solid #1e2430;
      transition: all 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .todo-item:hover {
      border-color: #2a3140;
      background: #181f2b;
    }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #5b657a;
    }
    .todo-item .todo-check {
      width: 24px; height: 24px;
      accent-color: #7c3aed;
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item .todo-text {
      flex: 1;
      word-break: break-word;
      font-size: 1rem;
      line-height: 1.4;
    }
    .todo-item .todo-delete {
      background: none;
      border: none;
      color: #6b7a8f;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }
    .todo-item .todo-delete:hover {
      background: #2a1f2a;
      color: #f87171;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: #5b657a;
      font-size: 1.1rem;
    }
    /* ===== LOADING ===== */
    .loading {
      text-align: center;
      padding: 2rem 0;
      color: #5b657a;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 999;
    }
    .toast {
      background: #1e2430;
      color: #e4e9f2;
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      border-left: 5px solid #a78bfa;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: slideIn 0.3s ease;
      font-size: 0.95rem;
    }
    .toast.error { border-left-color: #f87171; }
    .toast.success { border-left-color: #34d399; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: stretch; }
      .stats-badge { justify-content: center; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-group { justify-content: center; }
      .add-form { flex-wrap: wrap; }
      .add-form button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">✓ <span>NeiroSlop</span></div>
    <div class="stats-badge" id="stats">
      Всего: <span id="total">0</span>
      Выполнено: <span id="completed">0</span>
      Осталось: <span id="pending">0</span>
    </div>
  </header>

  <!-- Панель фильтрации и сортировки -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">Фильтр:</span>
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>
    <div class="toolbar-group">
      <span class="toolbar-label">Сортировка:</span>
      <select class="sort-select" id="sortSelect">
        <option value="created">Дате</option>
        <option value="title">Названию</option>
        <option value="completed">Статусу</option>
        <option value="id">ID</option>
      </select>
      <button class="order-btn active" data-order="asc">↑</button>
      <button class="order-btn" data-order="desc">↓</button>
    </div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="newTitle" placeholder="Что нужно сделать?" maxlength="255" autofocus />
    <button type="submit">Добавить</button>
  </form>

  <div class="todo-list" id="todoList">
    <div class="empty-state">✨ Нет задач — добавьте первую!</div>
  </div>
</div>

<!-- Toast-контейнер -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ===== API BASE =====
  const API_BASE = window.location.origin;

  // ===== STATE =====
  let todos = [];
  let currentFilter = 'all';
  let currentSort = 'created';
  let currentOrder = 'asc';

  // ===== DOM REFS =====
  const todoList = document.getElementById('todoList');
  const addForm = document.getElementById('addForm');
  const newTitle = document.getElementById('newTitle');
  const totalSpan = document.getElementById('total');
  const completedSpan = document.getElementById('completed');
  const pendingSpan = document.getElementById('pending');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const sortSelect = document.getElementById('sortSelect');
  const orderBtns = document.querySelectorAll('.order-btn');

  // ===== TOAST =====
  function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // ===== FETCH HELPERS =====
  async function fetchTodos(filter, sort, order) {
    const body = {
      Filter: filter === 'all' ? null : filter,
      Sort: sort,
      Order: order
    };
    const res = await fetch(`${API_BASE}/todos`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Ошибка загрузки задач');
    }
    return res.json();
  }

  async function createTodo(title) {
    const res = await fetch(`${API_BASE}/todos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Ошибка создания');
    }
    return res.json();
  }

  async function updateTodo(id, patch) {
    const res = await fetch(`${API_BASE}/todos/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Ошибка обновления');
    }
    return res.json();
  }

  async function deleteTodo(id) {
    const res = await fetch(`${API_BASE}/todos/${id}`, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Ошибка удаления');
    }
    return res.json();
  }

  async function fetchStats() {
    const res = await fetch(`${API_BASE}/todos/stats`);
    if (!res.ok) throw new Error('Ошибка статистики');
    return res.json();
  }

  // ===== RENDER =====
  function renderTodos() {
    if (todos.length === 0) {
      todoList.innerHTML = `<div class="empty-state">✨ Нет задач — добавьте первую!</div>`;
      updateStats(0, 0, 0);
      return;
    }
    let html = '';
    todos.forEach(t => {
      const checked = t.completed ? 'checked' : '';
      const completedClass = t.completed ? 'completed' : '';
      html += `
        <div class="todo-item ${completedClass}" data-id="${t.id}">
          <input type="checkbox" class="todo-check" ${checked} />
          <span class="todo-text">${escapeHtml(t.title)}</span>
          <button class="todo-delete" title="Удалить">✕</button>
        </div>
      `;
    });
    todoList.innerHTML = html;

    // Привязываем события
    todoList.querySelectorAll('.todo-item').forEach(item => {
      const id = parseInt(item.dataset.id);
      const check = item.querySelector('.todo-check');
      const delBtn = item.querySelector('.todo-delete');

      check.addEventListener('change', async () => {
        try {
          const updated = await updateTodo(id, { completed: check.checked });
          // обновим локально
          const idx = todos.findIndex(t => t.id === id);
          if (idx !== -1) todos[idx] = updated;
          // перерисовываем, чтобы сохранить порядок (сортировка уже применена на сервере)
          await refreshTodos();
          showToast(`Задача ${check.checked ? 'выполнена' : 'восстановлена'}`, 'success');
        } catch (e) {
          showToast(e.message, 'error');
          check.checked = !check.checked; // откат
        }
      });

      delBtn.addEventListener('click', async () => {
        if (!confirm('Удалить задачу?')) return;
        try {
          await deleteTodo(id);
          await refreshTodos();
          showToast('Задача удалена', 'success');
        } catch (e) {
          showToast(e.message, 'error');
        }
      });
    });
    updateStatsFromTodos();
  }

  function updateStatsFromTodos() {
    const total = todos.length;
    const completed = todos.filter(t => t.completed).length;
    const pending = total - completed;
    updateStats(total, completed, pending);
  }

  function updateStats(total, completed, pending) {
    totalSpan.textContent = total;
    completedSpan.textContent = completed;
    pendingSpan.textContent = pending;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== LOAD DATA WITH CURRENT PARAMS =====
  async function refreshTodos() {
    try {
      const data = await fetchTodos(currentFilter, currentSort, currentOrder);
      todos = data;
      renderTodos();
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  // ===== UPDATE STATS PERIODICALLY =====
  async function refreshStats() {
    try {
      const stats = await fetchStats();
      updateStats(stats.total, stats.completed, stats.pending);
    } catch (_) { /* ignore */ }
  }

  // ===== APPLY FILTER/SORT/ORDER =====
  function applySettings() {
    // обновляем активные классы кнопок фильтра
    filterBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === currentFilter);
    });
    // выбираем сортировку в селекте
    sortSelect.value = currentSort;
    // обновляем активные кнопки порядка
    orderBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.order === currentOrder);
    });
    // сохраняем в URL hash (для закладок)
    window.location.hash = `filter=${currentFilter}&sort=${currentSort}&order=${currentOrder}`;
    // загружаем данные
    refreshTodos();
  }

  // ===== INIT =====
  function initFromHash() {
    const hash = window.location.hash.slice(1);
    const params = new URLSearchParams(hash);
    if (params.has('filter')) currentFilter = params.get('filter');
    if (params.has('sort')) currentSort = params.get('sort');
    if (params.has('order')) currentOrder = params.get('order');
  }

  // ===== EVENTS =====
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      applySettings();
    });
  });

  sortSelect.addEventListener('change', () => {
    currentSort = sortSelect.value;
    applySettings();
  });

  orderBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentOrder = btn.dataset.order;
      applySettings();
    });
  });

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = newTitle.value.trim();
    if (!title) {
      showToast('Введите текст задачи', 'error');
      return;
    }
    if (title.length > 255) {
      showToast('Максимум 255 символов', 'error');
      return;
    }
    try {
      const newTodo = await createTodo(title);
      // после создания обновляем список (с текущими фильтрами/сортировкой)
      await refreshTodos();
      // обновляем статистику
      refreshStats();
      newTitle.value = '';
      newTitle.focus();
      showToast('Задача добавлена', 'success');
    } catch (e) {
      showToast(e.message, 'error');
    }
  });

  // ===== START =====
  initFromHash();
  applySettings(); // загрузит данные и применит настройки

  // обновляем статистику каждые 10 секунд
  setInterval(refreshStats, 10000);

  // слушаем изменение hash (если пользователь нажимает назад/вперёд)
  window.addEventListener('hashchange', () => {
    initFromHash();
    applySettings();
  });
</script>
</body>
</html>

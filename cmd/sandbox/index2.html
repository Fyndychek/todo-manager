<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ NeiroSlop Todo</title>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #e4e9f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app { max-width: 800px; width: 100%; }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      padding: 0.2rem 0.8rem;
      border-radius: 12px;
      color: #fff;
    }
    .stats-badge {
      background: #1e2430;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      gap: 1.2rem;
      border: 1px solid #2a3140;
    }
    .stats-badge span { font-weight: 600; color: #f472b6; }

    /* ===== CONTROLS ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
      background: #121820;
      padding: 0.8rem 1.2rem;
      border-radius: 16px;
      border: 1px solid #1e2430;
      align-items: center;
    }
    .filter-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid #2a3140;
      color: #8b95aa;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #f472b6; color: #e4e9f2; }
    .filter-btn.active {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }
    .sort-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-left: auto;
      flex-wrap: wrap;
    }
    .sort-group select {
      background: #1e2430;
      border: 1px solid #2a3140;
      color: #e4e9f2;
      padding: 0.35rem 1rem 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .sort-group select:focus { border-color: #f472b6; }
    .sort-order-btn {
      background: transparent;
      border: 1px solid #2a3140;
      color: #8b95aa;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .sort-order-btn:hover { border-color: #f472b6; color: #e4e9f2; }
    .sort-order-btn.active {
      border-color: #f472b6;
      background: rgba(244, 114, 182, 0.15);
      color: #f472b6;
    }

    /* ===== ADD FORM ===== */
    .add-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .add-form input {
      flex: 1;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      border: 2px solid #1e2430;
      background: #121820;
      color: #e4e9f2;
      font-size: 1rem;
      transition: border 0.2s;
    }
    .add-form input:focus { outline: none; border-color: #f472b6; }
    .add-form input::placeholder { color: #5b657a; }
    .add-form button {
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .add-form button:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }
    .add-form button:active { transform: scale(0.97); }

    /* ===== TODO LIST ===== */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #121820;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      border: 1px solid #1e2430;
      transition: all 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .todo-item:hover { border-color: #2a3140; background: #181f2b; }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #5b657a;
    }
    .todo-item .todo-check {
      width: 24px; height: 24px;
      accent-color: #ec4899;
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item .todo-text {
      flex: 1;
      word-break: break-word;
      font-size: 1rem;
      line-height: 1.4;
    }
    .todo-item .todo-delete {
      background: none;
      border: none;
      color: #6b7a8f;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }
    .todo-item .todo-delete:hover {
      background: #2a1f2a;
      color: #f87171;
    }
    .todo-item .todo-meta {
      font-size: 0.7rem;
      color: #5b657a;
      margin-left: 0.5rem;
      white-space: nowrap;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: #5b657a;
      font-size: 1.1rem;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 999;
    }
    .toast {
      background: #1e2430;
      color: #e4e9f2;
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      border-left: 5px solid #f472b6;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: slideIn 0.3s ease;
      font-size: 0.95rem;
    }
    .toast.error { border-left-color: #f87171; }
    .toast.success { border-left-color: #34d399; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: stretch; }
      .stats-badge { justify-content: center; }
      .controls { flex-direction: column; align-items: stretch; }
      .sort-group { margin-left: 0; justify-content: flex-start; }
      .add-form { flex-wrap: wrap; }
      .add-form button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">✦ <span>NeiroSlop</span></div>
    <div class="stats-badge" id="stats">
      Всего: <span id="total">0</span>
      Выполнено: <span id="completed">0</span>
      Осталось: <span id="pending">0</span>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>
    <div class="sort-group">
      <select id="sortField">
        <option value="created">Дате</option>
        <option value="title">Названию</option>
        <option value="id">ID</option>
        <option value="completed">Статусу</option>
      </select>
      <button class="sort-order-btn active" id="sortOrderBtn" title="По убыванию">↓</button>
    </div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="newTitle" placeholder="Что нужно сделать?" maxlength="255" autofocus />
    <button type="submit">Добавить</button>
  </form>

  <div class="todo-list" id="todoList">
    <div class="empty-state">✨ Нет задач — добавьте первую!</div>
  </div>
</div>

<!-- Toast-контейнер -->
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    const API_BASE = window.location.origin;

    // ===== STATE =====
    let todos = [];
    let currentFilter = 'all';
    let currentSort = 'created';
    let currentOrder = 'asc';

    // ===== DOM REFS =====
    const todoList = document.getElementById('todoList');
    const addForm = document.getElementById('addForm');
    const newTitle = document.getElementById('newTitle');
    const totalSpan = document.getElementById('total');
    const completedSpan = document.getElementById('completed');
    const pendingSpan = document.getElementById('pending');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const sortField = document.getElementById('sortField');
    const sortOrderBtn = document.getElementById('sortOrderBtn');

    // ===== TOAST =====
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ===== BUILD URL =====
    function buildTodosUrl() {
      const params = new URLSearchParams();
      params.set('filter', currentFilter);
      params.set('sort', currentSort);
      params.set('order', currentOrder);
      return `${API_BASE}/todos?${params.toString()}`;
    }

    // ===== FETCH HELPERS =====
    async function fetchTodos() {
      const url = buildTodosUrl();
      const res = await fetch(url);
      if (!res.ok) throw new Error('Не удалось загрузить задачи');
      const data = await res.json();
      // гарантируем массив
      return Array.isArray(data) ? data : [];
    }

    async function createTodo(title) {
      const res = await fetch(`${API_BASE}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка создания');
      }
      return res.json();
    }

    async function updateTodo(id, patch) {
      const res = await fetch(`${API_BASE}/todos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка обновления');
      }
      return res.json();
    }

    async function deleteTodo(id) {
      const res = await fetch(`${API_BASE}/todos/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка удаления');
      }
      return res.json();
    }

    async function fetchStats() {
      const res = await fetch(`${API_BASE}/todos/stats`);
      if (!res.ok) throw new Error('Ошибка статистики');
      return res.json();
    }

    // ===== RENDER =====
    function renderTodos() {
      // защита от null/undefined
      if (!Array.isArray(todos)) todos = [];

      if (todos.length === 0) {
        todoList.innerHTML = `<div class="empty-state">✨ Нет задач — добавьте первую!</div>`;
        updateStats(0, 0, 0);
        return;
      }

      let html = '';
      todos.forEach(t => {
        const checked = t.completed ? 'checked' : '';
        const completedClass = t.completed ? 'completed' : '';
        const createdStr = new Date(t.created_at).toLocaleDateString('ru-RU', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        html += `
          <div class="todo-item ${completedClass}" data-id="${t.id}">
            <input type="checkbox" class="todo-check" ${checked} />
            <span class="todo-text">${escapeHtml(t.title)}</span>
            <span class="todo-meta">${createdStr}</span>
            <button class="todo-delete" title="Удалить">✕</button>
          </div>
        `;
      });
      todoList.innerHTML = html;

      // Привязываем события
      todoList.querySelectorAll('.todo-item').forEach(item => {
        const id = parseInt(item.dataset.id);
        const check = item.querySelector('.todo-check');
        const delBtn = item.querySelector('.todo-delete');

        check.addEventListener('change', async () => {
          try {
            await updateTodo(id, { completed: check.checked });
            // После обновления перезагружаем список, чтобы синхронизировать с фильтром
            await loadTodos();
            showToast(`Задача ${check.checked ? 'выполнена' : 'восстановлена'}`, 'success');
          } catch (e) {
            showToast(e.message, 'error');
            check.checked = !check.checked; // откат
          }
        });

        delBtn.addEventListener('click', async () => {
          if (!confirm('Удалить задачу?')) return;
          try {
            await deleteTodo(id);
            await loadTodos();
            showToast('Задача удалена', 'success');
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });

      updateStatsFromTodos();
    }

    function updateStatsFromTodos() {
      if (!Array.isArray(todos)) todos = [];
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;
      updateStats(total, completed, pending);
    }

    function updateStats(total, completed, pending) {
      totalSpan.textContent = total;
      completedSpan.textContent = completed;
      pendingSpan.textContent = pending;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== LOAD DATA =====
    async function loadTodos() {
      try {
        todos = await fetchTodos(); // теперь всегда массив
        renderTodos();
      } catch (e) {
        showToast(e.message, 'error');
        // в случае ошибки оставляем старые данные (или сбрасываем в []?)
        if (!Array.isArray(todos)) todos = [];
        renderTodos(); // отрендерим то, что есть
      }
    }

    // ===== UPDATE CONTROLS UI =====
    function updateFilterUI() {
      filterBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
      });
    }

    function updateSortUI() {
      sortField.value = currentSort;
      sortOrderBtn.textContent = currentOrder === 'asc' ? '↑' : '↓';
      sortOrderBtn.classList.toggle('active', currentOrder === 'desc');
    }

    // ===== HANDLE FILTER CHANGE =====
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        if (filter === currentFilter) return;
        currentFilter = filter;
        updateFilterUI();
        loadTodos();
      });
    });

    // ===== HANDLE SORT CHANGE =====
    sortField.addEventListener('change', () => {
      const newSort = sortField.value;
      if (newSort === currentSort) return;
      currentSort = newSort;
      updateSortUI();
      loadTodos();
    });

    sortOrderBtn.addEventListener('click', () => {
      currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
      updateSortUI();
      loadTodos();
    });

    // ===== ADD FORM =====
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = newTitle.value.trim();
      if (!title) {
        showToast('Введите текст задачи', 'error');
        return;
      }
      if (title.length > 255) {
        showToast('Максимум 255 символов', 'error');
        return;
      }
      try {
        await createTodo(title);
        newTitle.value = '';
        newTitle.focus();
        await loadTodos();
        showToast('Задача добавлена', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    // ===== INIT =====
    currentFilter = 'all';
    currentSort = 'created';
    currentOrder = 'asc';
    updateFilterUI();
    updateSortUI();
    loadTodos();

    // Периодическое обновление статистики (каждые 10 сек)
    setInterval(async () => {
      try {
        const stats = await fetchStats();
        updateStats(stats.total, stats.completed, stats.pending);
      } catch (_) { /* игнорируем */ }
    }, 10000);

  })();
</script>
</body>
</html>
